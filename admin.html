<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dashboard Admin | Desa Sepinggan Gelik</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:"DM Sans",sans-serif;background:#f7f8f6;color:#26372c}main{max-width:1000px;margin:auto;padding:55px 20px 80px}.top{margin-bottom:30px}.top h1{font-family:"Playfair Display",serif;font-size:48px;margin:0 0 10px}.top p{font-size:20px;margin:0 0 24px}.btn{border:0;border-radius:14px;padding:13px 20px;background:#e9ece9;color:#26372c;font-size:16px;cursor:pointer}.card{background:#fff;border-radius:25px;padding:30px;box-shadow:0 12px 35px rgba(48,70,54,.10);margin-bottom:25px}.card h2{font-family:"Playfair Display",serif;font-size:30px;margin:0 0 22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{width:100%;padding:16px;border:1px solid #ddd;border-radius:15px;font:inherit;background:#fff}.full{grid-column:1/-1;min-height:120px;resize:vertical}.actions{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}.primary{background:#31533d;color:white}.item{display:grid;grid-template-columns:1fr auto;gap:15px;align-items:center;padding:18px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}.item h3{margin:0 0 6px;font-size:18px}.item p{margin:0;color:#68736b;font-size:14px}.item img{width:75px;height:55px;object-fit:cover;border-radius:10px;margin-right:10px}.item-info{display:flex;align-items:center}.small-btn{padding:9px 13px;border-radius:10px;border:0;cursor:pointer;margin-left:5px}.edit{background:#e8efe9}.delete{background:#f2dddd}.status{margin:0 0 15px;font-size:14px}@media(max-width:700px){main{padding:35px 16px}.top h1{font-size:38px}.top p{font-size:17px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.item{grid-template-columns:1fr}} </style></head><body><main><section class="top"><h1>Dashboard Admin</h1><p>Kelola data Website Desa Sepinggan Gelik</p><button class="btn" onclick="location.href='./index.html'">Kembali ke Website</button></section><section class="card"><h2>Tambah / Edit Data</h2><p class="status" id="status">Menghubungkan ke Google Spreadsheet...</p><div class="form-grid"><input id="judul" class="field" placeholder="Judul"><select id="kategori" class="field"><option value="">Pilih Kategori</option><option>Keindahan</option><option>Masyarakat</option><option>Keagamaan</option><option>Informasi</option><option>Lainnya</option></select><textarea id="deskripsi" class="field full" placeholder="Deskripsi"></textarea><input id="gambar" class="field full" placeholder="URL gambar (contoh: https://...)"></div><div class="actions"><button class="btn primary" id="saveBtn">Simpan Data</button><button class="btn" id="clearBtn">Bersihkan</button></div></section><section class="card"><h2>Data Beranda</h2><div id="list">Memuat data...</div></section></main><script>const API_URL="https://script.google.com/macros/s/AKfycbxEXPn8nesAhXldrGCLgTvCwyjsL5h-iwopHfb6n5nSx9xYJ0Yp8xN9G-zKbRXhNFy5/exec";let editingId=null,cc=0;function jsonp(params){return new Promise((resolve,reject)=>{const cb="adminCallback_"+Date.now()+"_"+(cc++),s=document.createElement("script"),q=new URLSearchParams({...params,callback:cb}),t=setTimeout(()=>{clean();reject(new Error("Koneksi timeout"))},10000);window[cb]=d=>{clean();resolve(d)};s.src=API_URL+"?"+q.toString();s.onerror=()=>{clean();reject(new Error("Gagal menghubungkan database"))};function clean(){clearTimeout(t);s.remove();delete window[cb]}document.body.appendChild(s)})}function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;")}function clearForm(){editingId=null;judul.value="";kategori.value="";deskripsi.value="";gambar.value="";saveBtn.textContent="Simpan Data"}function editItem(x){editingId=x.id;judul.value=x.judul||"";kategori.value=x.kategori||"";deskripsi.value=x.deskripsi||"";gambar.value=x.gambar||"";saveBtn.textContent="Simpan Perubahan";scrollTo({top:0,behavior:"smooth"})}async function load(){try{const r=await jsonp({action:"get"});if(!r.success)throw Error(r.message);render(r.data||[]);status.textContent="Terhubung ke Google Spreadsheet."}catch(e){list.textContent="Database belum dapat diakses: "+e.message;status.textContent="Koneksi database gagal."}}function render(data){if(!data.length){list.innerHTML="Belum ada data.";return}list.innerHTML=data.map(x=>`<div class="item"><div class="item-info">${x.gambar?`<img src="${esc(x.gambar)}" onerror="this.style.display='none'">`:""}<div><h3>${esc(x.judul)}</h3><p>${esc(x.kategori)} — ${esc(x.deskripsi)}</p></div></div><div><button class="small-btn edit" onclick='editItem(${JSON.stringify(x)})'>Edit</button><button class="small-btn delete" onclick='deleteItem(${JSON.stringify(x.id)})'>Hapus</button></div></div>`).join("")}async function deleteItem(id){if(!confirm("Hapus data ini?"))return;try{const r=await jsonp({action:"hapus",id});if(!r.success)throw Error(r.message);clearForm();await load()}catch(e){alert(e.message)}}clearBtn.onclick=clearForm;saveBtn.onclick=async()=>{const p={action:editingId?"edit":"tambah",id:editingId||"",judul:judul.value.trim(),kategori:kategori.value,deskripsi:deskripsi.value.trim(),gambar:gambar.value.trim()};if(!p.judul){alert("Judul harus diisi.");return}try{const r=await jsonp(p);if(!r.success)throw Error(r.message);alert(r.message);clearForm();await load()}catch(e){alert(e.message)}};load();</script></body></html>
